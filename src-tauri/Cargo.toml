[package]
name = "edart"
description = "The Tauri shell: window, IPC commands, bundling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "edart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edart-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }

[features]
# Turned on by `tauri build`. Serves the bundled frontend instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = ["std", "alloc", "bitflags", "dispatch2", "CBPeripheralManager", "CBManager", "CBAttribute", "CBCharacteristic", "CBService", "CBDescriptor", "CBUUID", "CBATTRequest", "CBCentral", "CBPeer", "CBAdvertisementData", "CBError", "CBCentralManager", "CBPeripheral"] }
objc2-foundation = "0.3.2"
# Screen mirroring: a USB iPhone is an AVFoundation capture device.
dispatch2 = "0.3.1"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVCaptureSession", "AVMediaFormat"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-video", "CMSampleBuffer"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFCGTypes"] }
# Trading rails: read the text on the mirrored screen (on this Mac) before
# a gesture is sent.
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
